<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AUREVIA">
  <!--
    Isotipo AUREVIA — identidad aurora (2026-08-08).
    La MISMA Λ sin travesaño del wordmark oficial (MarcaAurevia.astro), en
    monolínea con el mismo degradado azul, sobre tile azul noche con halo en
    el vértice. Reemplaza al tile dental anterior: la marca es UNA sola en
    homepage, login, panel y favicon — y ya no es dental-only.
  -->
  <defs>
    <linearGradient id="am-tile" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#04070F"/>
    </linearGradient>
    <linearGradient id="am-trazo" x1="16" y1="32" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E8BFF"/>
      <stop offset="0.55" stop-color="#5FBFFF"/>
      <stop offset="1" stop-color="#8FD9FF"/>
    </linearGradient>
    <radialGradient id="am-luz" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#2E7CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2E7CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="am-nodo" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Tile azul noche con iluminación superior -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="16" fill="url(#am-tile)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="16" fill="url(#am-luz)"/>

  <!-- Λ monolínea, misma pendiente y remates del wordmark -->
  <path d="M17 47 L32 16.5 L47 47" stroke="url(#am-trazo)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Nodo luminoso en el vértice (continuidad con la marca anterior) -->
  <circle cx="32" cy="14.5" r="6" fill="#3E8BFF" opacity="0.4" filter="url(#am-nodo)"/>
  <circle cx="32" cy="14.5" r="2.4" fill="#B6ECFF"/>

  <!-- Hairline del tile -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="16" fill="none"
        stroke="rgba(99,151,255,0.3)" stroke-width="1.4"/>
</svg>
