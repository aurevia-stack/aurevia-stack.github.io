<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AUREVIA — software de gestión para clínicas dentales">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071523"/>
      <stop offset="0.55" stop-color="#0A1C2E"/>
      <stop offset="1" stop-color="#06131F"/>
    </linearGradient>
    <linearGradient id="marca" x1="0" y1="630" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1668CC"/>
      <stop offset="0.5" stop-color="#2B8FEF"/>
      <stop offset="1" stop-color="#00B8A9"/>
    </linearGradient>
    <linearGradient id="arco" x1="200" y1="600" x2="1100" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B8FEF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Halos de marca -->
  <circle cx="120" cy="80" r="220" fill="#2B8FEF" opacity="0.16" filter="url(#glow)"/>
  <circle cx="1080" cy="560" r="240" fill="#00B8A9" opacity="0.14" filter="url(#glow)"/>

  <!-- Arcada dental estilizada -->
  <g fill="none" stroke="url(#arco)" stroke-linecap="round">
    <path d="M760 120 C 900 190, 1010 300, 1035 430" stroke-width="3" opacity="0.55"/>
    <path d="M700 470 C 810 480, 930 430, 1010 330" stroke-width="2" opacity="0.4"/>
  </g>
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.32">
    <line x1="806" y1="447" x2="806" y2="479"/>
    <line x1="866" y1="440" x2="866" y2="472"/>
    <line x1="922" y1="416" x2="922" y2="448"/>
    <line x1="972" y1="380" x2="972" y2="412"/>
    <line x1="1010" y1="333" x2="1010" y2="365"/>
  </g>

  <!-- Marca -->
  <g transform="translate(96, 150)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#marca)"/>
    <path d="M16 40 L28 16 L40 40" stroke="#071523" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="39" font-family="Sora, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="7" fill="#F2F7FB">AUREVIA</text>
  </g>

  <!-- Titular -->
  <text x="96" y="310" font-family="Sora, 'Segoe UI', system-ui, sans-serif" font-size="62" font-weight="700" fill="#F2F7FB">Más tratamientos confirmados.</text>
  <text x="96" y="386" font-family="Sora, 'Segoe UI', system-ui, sans-serif" font-size="62" font-weight="700" fill="#38BDF8">Menos horas perdidas.</text>

  <!-- Bajada -->
  <text x="96" y="452" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#C2D3E2">Gestión, automatización y rentabilidad para clínicas dentales.</text>

  <!-- Píldoras de módulos -->
  <g font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#8AA0B4">
    <rect x="96" y="500" width="164" height="46" rx="23" fill="none" stroke="#38BDF8" stroke-opacity="0.32"/>
    <text x="124" y="529">Agenda</text>
    <rect x="276" y="500" width="212" height="46" rx="23" fill="none" stroke="#38BDF8" stroke-opacity="0.32"/>
    <text x="304" y="529">Presupuestos</text>
    <rect x="504" y="500" width="186" height="46" rx="23" fill="none" stroke="#38BDF8" stroke-opacity="0.32"/>
    <text x="532" y="529">Cobranza</text>
    <rect x="706" y="500" width="196" height="46" rx="23" fill="none" stroke="#38BDF8" stroke-opacity="0.32"/>
    <text x="734" y="529">Indicadores</text>
  </g>
</svg>
